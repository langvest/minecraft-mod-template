plugins {
	id "net.minecraftforge.gradle" version "$forge_gradle_version"
	id "org.spongepowered.mixin" version "$mixin_gradle_version"
	id "org.parchmentmc.librarian.forgegradle" version "$parchment_gradle_version"
}

repositories {
	// Put repositories for dependencies here
	// ForgeGradle automatically adds the Forge maven and Maven Central for you

	// If you have mod jar dependencies in ./libs, you can declare them as a repository like so.
	// See more information here: https://docs.gradle.org/current/userguide/declaring_repositories.html#sub:flat_dir_resolver
	//flatDir {
	//    dir 'libs'
	//}
}

dependencies {
	compileOnly project(":common")

	// Specify the version of Minecraft to use.
	// Any artifact can be supplied so long as it has a "userdev" classifier artifact and is a compatible patcher artifact.
	// The "userdev" classifier will be requested and setup by ForgeGradle.
	// If the group id is "net.minecraft" and the artifact id is one of ["client", "server", "joined"],
	// then special handling is done to allow a setup of a vanilla dependency without the use of an external repository.
	minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

	annotationProcessor "org.spongepowered:mixin:$mixin_version:processor"

	// Example mod dependency with JEI.
	// The JEI API is declared for compile time use, while the full JEI artifact is used at runtime.
	//compileOnly "mezz.jei:jei-${mc_version}-forge-api:${jei_version}"
	//runtimeOnly "mezz.jei:jei-${mc_version}-forge:${jei_version}"

	// Example mod dependency using a mod jar from ./libs with a flat dir repository
	// This maps to ./libs/coolmod-${mc_version}-${coolmod_version}.jar
	// The group id is ignored when searching -- in this case, it is "blank"
	//implementation fg.deobf("blank:coolmod-${mc_version}:${coolmod_version}")

	// For more info:
	// http://www.gradle.org/docs/current/userguide/artifact_dependencies_tutorial.html
	// http://www.gradle.org/docs/current/userguide/dependency_management.html
}

def MAIN_SOURCE_SET = sourceSets.main
def MAIN_RESOURCES_PATH = "src/main/resources"
def GENERATED_RESOURCES_PATH = "src/generated/resources"
def ACCESS_TRANSFORMER_PATH = MAIN_RESOURCES_PATH + "/META-INF/accesstransformer.cfg"
def MIXIN_COMMON_CONFIG = mod_id + ".mixins.json"
def MIXIN_FORGE_CONFIG = mod_id + ".forge.mixins.json"

mixin {
	config MIXIN_COMMON_CONFIG
	config MIXIN_FORGE_CONFIG
}

jar {
	manifest {
		attributes "Built-On-Forge": forge_version

		// As of 1.20.6 Forge no longer has reobf tasks. This has broken mixins adding configs correctly into the manifest file.
		// See more information here: https://github.com/SpongePowered/MixinGradle/blob/f800b26d2b180d98d9aa9355e5b3086d71218508/src/main/groovy/org/spongepowered/asm/gradle/plugins/MixinExtension.groovy#L184
		// Instead, we will do it ourselves.
		attributes "MixinConfigs": MIXIN_COMMON_CONFIG + "," + MIXIN_FORGE_CONFIG
	}

	exclude "*.accesswidener"
}

minecraft {
	// The mapping channel to use for mappings.
	// The default set of supported mapping channels are 'official', 'snapshot', 'snapshot_nodoc', 'stable', 'stable_nodoc'.
	// Additional mapping channels can be registered through the 'channelProviders' extension in a Gradle plugin.
	//
	// | Channel   | Version              |                                                                                |
	// |-----------|----------------------|--------------------------------------------------------------------------------|
	// | official  | MCVersion            | Official field/method names from Mojang mapping files                          |
	// | parchment | YYYY.MM.DD-MCVersion | Open community-sourced parameter names and javadocs layered on top of official |
	//
	// You must be aware of the Mojang license when using the 'official' or 'parchment' mappings.
	// See more information here: https://github.com/MinecraftForge/MCPConfig/blob/master/Mojang.md
	//
	// Parchment is an unofficial project maintained by ParchmentMC, separate from Minecraft Forge.
	// See more information here: https://parchmentmc.org/docs/getting-started
	//
	// We preferred parchment mappings here.
	mappings channel: parchment_channel, version: parchment_version

	// This property allows configuring Gradle's ProcessResources task(s) to run on IDE output locations before launching the game.
	// It is REQUIRED to be set to true for this template to function.
	// See more information here: https://docs.gradle.org/current/dsl/org.gradle.language.jvm.tasks.ProcessResources.html
	// NOTE: If 'true' calls processResources when in dev.
	copyIdeResources = true

	// Tell ForgeGradle to not automtically create the reobf tasks, as we now use Official mappings at runtime.
	// If you don't use them at dev time then you'll have to fix your reobf yourself.
	// NOTE: Forge 1.20.6+ uses official mappings at runtime, so we shouldn't reobf from official to SRG.
	reobf = false

	// This property enables access transformers for use in development.
	// They will be applied to the Minecraft artifact.
	// The access transformer file can be anywhere in the project.
	// However, it must be at "META-INF/accesstransformer.cfg" in the final mod jar to be loaded by Forge.
	// This default location is a best practice to automatically put the file in the right place in the final jar.
	// See more information here: https://docs.minecraftforge.net/en/latest/advanced/accesstransformers
	accessTransformer file(ACCESS_TRANSFORMER_PATH)

	// Default run configurations.
	// These can be tweaked, removed, or duplicated as needed.
	runs {
		// Applies to all the run configs below.
		configureEach {
			ideaModule "${rootProject.name}.${project.name}.main"

			// Recommended logging data for a userdev environment.
			// The markers can be added/remove as needed separated by commas:
			// "SCAN" - For mods scan.
			// "REGISTRIES" - For firing of registry events.
			// "REGISTRYDUMP" - For getting the contents of all registries.
			property "forge.logging.markers", "REGISTRIES"

			// Recommended logging level for the console.
			// You can set various levels here.
			// See more information here: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
			property "forge.logging.console.level", "debug"
		}

		client {
			workingDirectory file("runs/client")

			taskName "runClient"

			property "forge.enabledGameTestNamespaces", mod_id

			mods {
				modClientRun {
					source MAIN_SOURCE_SET
				}
			}
		}

		server {
			workingDirectory file("runs/server")

			taskName "runServer"

			property "forge.enabledGameTestNamespaces", mod_id

			args "--nogui"

			mods {
				modServerRun {
					source MAIN_SOURCE_SET
				}
			}
		}

		data {
			workingDirectory file("runs/data")

			args "--nogui", "--mod", mod_id, "--all", "--output", project(":common").file(GENERATED_RESOURCES_PATH), "--existing", project(":common").file(MAIN_RESOURCES_PATH)

			taskName "generateData"

			mods {
				modDataRun {
					source MAIN_SOURCE_SET
				}
			}
		}
	}
}

// Merge the resources and classes into the same directory.
// This is done because java expects modules to be in a single directory.
// And if we have it in multiple we have to do performance intensive hacks like having the UnionFileSystem.
// This will eventually be migrated to ForgeGradle so modders don't need to manually do it. But that is later.
sourceSets.each {
	def dir = layout.buildDirectory.dir("sourcesSets/$it.name")

	it.output.resourcesDir = dir
	it.java.destinationDirectory = dir
}
