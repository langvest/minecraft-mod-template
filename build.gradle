def JAVA_VERSION = JavaLanguageVersion.of(java_version)
def FILES_TO_EXPAND = ["pack.mcmeta", "META-INF/mods.toml", "*.mixins.json"]

ext {
	java_vm_version = System.getProperty("java.vm.version")
	java_vm_vendor = System.getProperty("java.vm.vendor")
}

println "$mod_name: $mod_version"
println "Forge: $forge_version"
println "Minecraft: $minecraft_version"
println "Java: $java_vm_version ($java_vm_vendor)"

subprojects {
	apply plugin: "java"
	apply plugin: "idea"
	apply plugin: "maven-publish"

	def currentProjectName = it.name
	def isCommonProject = currentProjectName == project(":common").name

	version = minecraft_version + "-" + mod_version
	group = mod_group_id

	base {
		archivesName = mod_archives_base_name + "-" + currentProjectName
	}

	java {
		sourceCompatibility = JAVA_VERSION
		targetCompatibility = JAVA_VERSION
		toolchain.languageVersion.set(JAVA_VERSION)
		withSourcesJar()
	}

	jar {
		manifest {
			attributes "Specification-Title": mod_name
			attributes "Specification-Version": mod_version
			attributes "Specification-Vendor": mod_authors
			attributes "Implementation-Title": mod_name
			attributes "Implementation-Version": mod_version
			attributes "Implementation-Vendor": mod_authors
			attributes "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
			attributes "Timestamp": System.currentTimeMillis()
			attributes "Built-On-Java": "$java_vm_version ($java_vm_vendor)"
			attributes "Built-On-Minecraft": minecraft_version
		}
	}

	if(!isCommonProject) {
		def commonMainSourceSet = project(":common").sourceSets.main

		tasks.named("processResources", ProcessResources) {
			doFirst {
				from commonMainSourceSet.resources
			}
		}

		tasks.named("sourcesJar", Jar) {
			doFirst {
				from commonMainSourceSet.allSource
			}
		}

		tasks.withType(JavaCompile).configureEach {
			doFirst {
				source commonMainSourceSet.allSource
			}
		}

		tasks.withType(Javadoc).configureEach {
			doFirst {
				source commonMainSourceSet.allJava
			}
		}
	}

	// This block of code expands all declared replace properties in the specified resource targets.
	// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
	// When 'copyIdeResources' is enabled, this will also run before the game launches in IDE environments.
	// See more information here: https://docs.gradle.org/current/dsl/org.gradle.language.jvm.tasks.ProcessResources.html
	processResources {
		def properties = new Properties()

		rootProject.file("gradle.properties").withInputStream {
			properties.load(it)
		}

		inputs.properties(properties)

		filesMatching(FILES_TO_EXPAND) {
			expand properties
		}
	}

	// IntelliJ no longer downloads javadocs and sources by default.
	// This tells Gradle to force IDEA to do it.
	idea.module {
		downloadJavadoc = true
		downloadSources = true
	}

	tasks.withType(JavaCompile).configureEach {
		options.encoding = "UTF-8"
		options.release = JAVA_VERSION.asInt()
	}

	// Disable Gradle's custom module metadata from being published to maven.
	// The metadata includes mapped dependencies which are not reasonably
	// consumable by other mod developers.
	tasks.withType(GenerateModuleMetadata).configureEach {
		enabled = false
	}
}
